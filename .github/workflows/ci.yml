name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m compileall src tests scripts
      - run: python -m unittest discover -s tests
      - run: snowflake-query-credit-guardrail fixtures/snowflake-query-credit-sample.json --format json
      - run: python scripts/build_site.py
      - name: static safety scan
        run: |
          set -euo pipefail
          ! grep -RInE 'chaus|PRIVATE KEY|SSH_PRIVATE_KEY|FTP_|SSH_|82\.25\.89\.47|u815783393' \
            --exclude-dir=.git --exclude-dir=.github --exclude-dir=.venv --exclude-dir=site .
